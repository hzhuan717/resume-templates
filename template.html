.section{margin-top:30px}.section h2{font-size:17px;margin:0 0 12px}.desc{background:#fff;border:1px solid var(--line);border-radius:var(--radius);padding:18px;font-size:13.5px;color:#52666e;line-height:1.9}.desc b{color:var(--teal-dark)}

.related{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}.rel-card{background:#fff;border:1px solid var(--line);border-radius:10px;overflow:hidden;transition:.2s}.rel-card:hover{box-shadow:0 8px 20px rgba(30,60,72,.12);transform:translateY(-2px)}.rel-card img{display:block;width:100%;aspect-ratio:794/1123;object-fit:cover}.rel-card b{display:block;padding:8px 9px;font-size:11.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

@media (max-width:960px){.layout{grid-template-columns:1fr}.buy{order:-1}.nav-links{display:none}.related{grid-template-columns:repeat(2,1fr)}}
@media (max-width:600px){.wrap{padding:0 14px}.nav{height:56px}.nav-cta{padding:7px 12px;font-size:12px}.info h1{font-size:24px}.preview-stage{padding:10px}.preview-tools{gap:6px}.main{padding-top:8px}.mobile-cta{display:flex;position:fixed;left:0;right:0;bottom:0;z-index:950;background:#fff;border-top:1px solid var(--line);padding:10px 14px;gap:10px;align-items:center;box-shadow:0 -8px 24px rgba(20,44,54,.1)}.mobile-cta .price{font-size:13px;font-weight:800;color:var(--teal-dark);flex:0 0 auto}.mobile-cta .cta{flex:1;text-align:center;background:var(--teal);color:#fff;border-radius:8px;padding:11px;font-weight:800;font-size:14px}body{padding-bottom:64px}.site-footer{padding-bottom:20px}}

<script src="assets/templates.js"></script>
<script>
var EXTRA = [{ id:'classic-teal', name:'经典青绿丝带（原版）', cat:'简约', photo:true, pages:1 }];
var LIST = EXTRA.concat(window.QMT_LIST || []);
var id = new URLSearchParams(location.search).get('id') || 't001';
var t = null;
for (var i=0;i<LIST.length;i++) if (LIST[i].id === id) t = LIST[i];
var content = document.getElementById('content');

function esc(s){ return String(s == null ? '' : s).replace(/[&<>"]/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); }
function url(x){ return 'template.html?id=' + encodeURIComponent(x.id); }
function useUrl(x){ return 'templates/' + encodeURIComponent(x.id) + '.html'; }

if (!t){
  document.title = '模板不存在 · 简历模板库';
  content.innerHTML = '<div class="error"><b>没有找到这套模板</b><p>链接可能过期，或者模板编号写错了。</p><a href="index.html#library">返回模板库 →</a></div>';
} else {
  document.title = t.name + ' · 简历模板库';
  var desc = '「' + t.name + '」是一套' + t.cat + '风格的中文简历模板，共 ' + (t.pages || 1) + ' 页' + (t.photo ? '，带可替换证件照位' : '，不含照片位') + '。免注册，打开即可在纸面上直接修改，导出 A4 PDF。';
  document.getElementById('crumbName').textContent = t.name;
  var metaDesc = document.querySelector('meta[name=description]');
  if (metaDesc) metaDesc.setAttribute('content', desc);
  var related = LIST.filter(function(x){ return x.cat === t.cat && x.id !== t.id; }).slice(0,4);
  content.innerHTML =
    '<div class="layout">' +
      '<div>' +
        '<div class="preview-card">' +
          '<div class="preview-stage"><a href="assets/thumbs/' + esc(t.id) + '.webp" target="_blank" rel="noopener" title="打开原图"><img id="bigImg" src="assets/thumbs/' + esc(t.id) + '.webp" alt="' + esc(t.name) + ' 整页预览" width="794" height="1123"></a></div>' +
          '<div class="preview-tools"><span class="hint">整页预览 · 点击图片可看原图</span><span><a class="btn" href="assets/thumbs/' + esc(t.id) + '.webp" target="_blank" rel="noopener">看原图</a> <a class="btn" href="' + useUrl(t) + '">打开编辑器</a></span></div>' +
        '</div>' +
        '<div class="section"><h2>这套模板适合谁</h2><div class="desc">' + esc(desc) + '<div class="modules"><span>基本信息</span><span>教育背景</span><span>工作 / 实习</span><span>项目经历</span><span>技能特长</span><span>荣誉证书</span><span>自我评价</span></div></div></div>' +
      '</div>' +
      '<aside class="info">' +
        '<h1>' + esc(t.name) + '</h1>' +
        '<p class="sub">' + esc(t.cat) + '风格 · ' + (t.pages || 1) + ' 页 · ' + (t.photo ? '可换证件照' : '无照片位') + '</p>' +
        '<div class="meta-row"><span class="pill">' + esc(t.cat) + '</span><span class="pill">' + (t.pages || 1) + ' 页</span>' + (t.photo ? '<span class="pill warm">可换照片</span>' : '<span class="pill">无照片位</span>') + '<span class="pill">中文</span></div>' +
        '<div class="buy">' +
          '<h2>使用这套模板</h2><div class="price">免费 <small>· 无需注册</small></div>' +
          '<a class="cta" href="' + useUrl(t) + '">打开并开始编辑</a>' +
          '<p class="note">内容只保存在你的浏览器，不上传</p>' +
          '<ul><li>打开即改，自动保存</li><li>可替换证件照</li><li>工具条可换强调色 / 字体</li><li>打印或导出 A4 PDF</li><li>可下载 HTML / 备份 JSON</li></ul>' +
        '</div>' +
        '<div class="section"><h2>相关模板</h2><div class="related">' + related.map(function(x){
          return '<a class="rel-card" href="' + url(x) + '"><img src="assets/thumbs/' + esc(x.id) + '.webp" alt="' + esc(x.name) + '" loading="lazy"><b>' + esc(x.name) + '</b></a>';
        }).join('') + '</div></div>' +
      '</aside>' +
    '</div>' +
    '<div class="mobile-cta"><span class="price">免费</span><a class="cta" href="' + useUrl(t) + '">打开并编辑</a></div>';
}
</script>
