<style>
:root{--brand:#2563EB;--brand-dark:#1D4ED8;--brand-deep:#1E40AF;--brand-050:#EFF6FF;--brand-100:#DBEAFE;--brand-200:#BFDBFE;--brand-300:#93C5FD;--ink:#0F172A;--body:#3B4A5C;--muted:#64748B;--faint:#94A3B8;--bg:#F6F8FB;--line:#E5EAF1;--line-strong:#D5DDE8;--warm:#D97706;--warm-deep:#B45309;--warm-bg:#FFFBEB;--warm-line:#FDE68A;--radius:16px;--shadow-sm:0 1px 2px rgba(15,23,42,.05);--shadow-md:0 8px 20px -6px rgba(15,23,42,.1);--shadow-lg:0 18px 44px -14px rgba(15,23,42,.18);--shadow-brand:0 6px 16px -4px rgba(37,99,235,.32);--font:-apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei","PingFang SC","Hiragino Sans GB",sans-serif}
*{box-sizing:border-box}html,body{margin:0;padding:0}body{background:var(--bg);color:var(--ink);font-family:var(--font);line-height:1.6;-webkit-font-smoothing:antialiased}::selection{background:var(--brand-100)}a{text-decoration:none;color:inherit}button{font-family:inherit;cursor:pointer}img{max-width:100%}.wrap{max-width:1200px;margin:0 auto;padding:0 24px}.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0)}
.site-header{position:sticky;top:0;z-index:900;background:rgba(255,255,255,.88);backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
.nav{height:64px;display:flex;align-items:center;gap:28px}.brand{display:flex;align-items:center;gap:10px;font-weight:800;font-size:17px;color:var(--ink)}.brand-mark{width:32px;height:32px;border-radius:9px;background:linear-gradient(135deg,#3B82F6 0%,#2563EB 55%,#4F46E5 100%);color:#fff;display:grid;place-items:center;font-size:15px;box-shadow:var(--shadow-brand)}.brand small{display:block;font-size:10px;line-height:1.1;color:var(--faint);font-weight:500;letter-spacing:1.5px}.nav-links{display:flex;gap:24px;font-size:14px;color:#526078}.nav-links a{transition:.15s}.nav-links a:hover{color:var(--brand)}.nav-spacer{flex:1}.nav-cta{background:var(--brand);color:#fff;border-radius:9px;padding:9px 18px;font-size:14px;font-weight:700;box-shadow:var(--shadow-brand);transition:.15s}.nav-cta:hover{background:var(--brand-dark);transform:translateY(-1px)}
.crumb{padding:18px 0 0;font-size:12.5px;color:var(--muted)}.crumb a{color:var(--brand);font-weight:600}.crumb a:hover{color:var(--brand-dark)}.crumb span{margin:0 7px;color:#C3CEDC}
.main{padding:18px 0 56px}.layout{display:grid;grid-template-columns:minmax(0,1.45fr) minmax(300px,.75fr);gap:30px;align-items:start}
.preview-card{background:#fff;border:1px solid var(--line);border-radius:var(--radius);padding:14px;box-shadow:var(--shadow-sm)}
.preview-stage{position:relative;background:#EDF1F7;background-image:radial-gradient(rgba(100,116,139,.16) 1px,transparent 1px);background-size:18px 18px;border-radius:10px;padding:24px;display:flex;justify-content:center;align-items:flex-start;overflow:hidden}
.preview-stage img{display:block;width:min(100%,680px);height:auto;box-shadow:0 16px 40px rgba(15,23,42,.18);background:#fff;border:1px solid #E8EDF4;border-radius:4px}
.preview-tools{display:flex;gap:10px;align-items:center;justify-content:space-between;padding:12px 2px 0;flex-wrap:wrap}
.preview-tools .hint{font-size:12px;color:var(--muted)}
.btn{border:1px solid var(--line);background:#fff;color:var(--body);border-radius:8px;padding:8px 13px;font-size:12.5px;font-weight:600;display:inline-flex;align-items:center;gap:6px;transition:.15s}
.btn:hover{border-color:var(--brand-300);background:var(--brand-050);color:var(--brand)}
.btn-primary{background:var(--brand);border-color:var(--brand);color:#fff;box-shadow:var(--shadow-brand)}.btn-primary:hover{background:var(--brand-dark);border-color:var(--brand-dark);color:#fff}
.info h1{margin:2px 0 8px;font-size:30px;letter-spacing:-.4px;line-height:1.3;color:var(--ink)}.info .sub{color:var(--muted);font-size:13px;margin:0 0 16px}
.meta-row{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:18px}.pill{background:#fff;border:1px solid var(--line);border-radius:99px;padding:4px 11px;font-size:11.5px;color:var(--body)}.pill.warm{color:var(--warm-deep);border-color:var(--warm-line);background:var(--warm-bg)}
.warn{margin:0 0 14px;padding:10px 12px;border:1px solid var(--warm-line);background:var(--warm-bg);color:#92400E;border-radius:10px;font-size:12px;line-height:1.7}
.buy{background:#fff;border:1px solid var(--line);border-radius:var(--radius);padding:20px;box-shadow:var(--shadow-md)}
.buy h2{margin:0 0 4px;font-size:16px;color:var(--ink)}.buy .price{font-size:24px;font-weight:800;color:var(--brand);margin:4px 0 2px}.buy .price small{font-size:11px;color:var(--muted);font-weight:400}.buy .cta{display:block;text-align:center;background:var(--brand);color:#fff;border-radius:10px;padding:13px;font-size:14px;font-weight:800;margin:12px 0 8px;box-shadow:var(--shadow-brand);transition:.15s}.buy .cta:hover{background:var(--brand-dark);transform:translateY(-1px)}.buy .note{font-size:11.5px;color:var(--muted);text-align:center;margin:0 0 10px}.buy ul{list-style:none;margin:12px 0 0;padding:12px 0 0;border-top:1px solid var(--line);font-size:12px;color:var(--body);display:grid;gap:8px}.buy li::before{content:"✓";color:var(--brand);margin-right:6px;font-weight:800}
.section{margin-top:30px}.section h2{font-size:17px;margin:0 0 12px;color:var(--ink)}.desc{background:#fff;border:1px solid var(--line);border-radius:var(--radius);padding:18px;font-size:13.5px;color:var(--body);line-height:1.9;box-shadow:var(--shadow-sm)}.desc b{color:var(--ink)}
.modules{display:flex;flex-wrap:wrap;gap:7px;margin-top:10px}.modules span{border:1px solid var(--line);background:#F8FAFC;border-radius:8px;padding:4px 10px;font-size:11.5px;color:var(--body)}
.related{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}.rel-card{background:#fff;border:1px solid var(--line);border-radius:12px;overflow:hidden;box-shadow:var(--shadow-sm);transition:.2s}.rel-card:hover{box-shadow:var(--shadow-md);transform:translateY(-3px);border-color:var(--brand-200)}.rel-card img{display:block;width:100%;aspect-ratio:794/1123;object-fit:cover;border-bottom:1px solid var(--line)}.rel-card b{display:block;padding:8px 10px;font-size:11.5px;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mobile-cta{display:none}
.site-footer{background:#0F172A;color:#94A3B8;padding:36px 0 24px;margin-top:40px}.footer-bottom{border-top:1px solid rgba(148,163,184,.16);padding-top:14px;display:flex;justify-content:space-between;gap:14px;font-size:11.5px;color:#64748B;flex-wrap:wrap}.site-footer .brand{color:#fff;margin-bottom:8px}.site-footer .brand small{color:#64748B}.site-footer p{margin:0;font-size:12.5px;color:#64748B;max-width:520px;line-height:1.9}
.error{background:#fff;border:1px solid var(--line);border-radius:var(--radius);padding:40px;text-align:center;box-shadow:var(--shadow-sm)}.error b{display:block;font-size:18px;margin-bottom:8px}.error a{color:var(--brand);font-weight:700}
@media (max-width:960px){.layout{grid-template-columns:1fr}.buy{order:-1}.nav-links{display:none}.related{grid-template-columns:repeat(2,1fr)}}
@media (max-width:600px){.wrap{padding:0 14px}.nav{height:56px}.nav-cta{padding:7px 12px;font-size:12px}.info h1{font-size:24px}.preview-stage{padding:12px}.preview-tools{gap:6px}.main{padding-top:8px}.mobile-cta{display:flex;position:fixed;left:0;right:0;bottom:0;z-index:950;background:#fff;border-top:1px solid var(--line);padding:10px 14px;gap:10px;align-items:center;box-shadow:0 -8px 24px rgba(15,23,42,.1)}.mobile-cta .price{font-size:13px;font-weight:800;color:var(--brand);flex:0 0 auto}.mobile-cta .cta{flex:1;text-align:center;background:var(--brand);color:#fff;border-radius:10px;padding:12px;font-weight:800;font-size:14px;box-shadow:var(--shadow-brand)}body{padding-bottom:64px}.site-footer{padding-bottom:20px}}
</style>

<script>
var EXTRA = [{ id:'classic-teal', name:'经典青绿丝带（原版）', cat:'简约', photo:true, pages:1 }];
var LIST = EXTRA.concat(window.QMT_LIST || []);
var id = new URLSearchParams(location.search).get('id') || 't001';
var t = null;
for (var i=0;i<LIST.length;i++) if (LIST[i].id === id) t = LIST[i];
var content = document.getElementById('content');

function esc(s){ return String(s == null ? '' : s).replace(/[&<>"]/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); }
function url(x){ return 'template.html?id=' + encodeURIComponent(x.id); }
function useUrl(x){ return 'templates/' + encodeURIComponent(x.id) + '.html'; }

if (!t){
  document.title = '模板不存在 · 简历模板库';
  content.innerHTML = '<div class="error"><b>没有找到这套模板</b><p>链接可能过期，或者模板编号写错了。</p><a href="index.html#library">返回模板库 →</a></div>';
} else {
  document.title = t.name + ' · 简历模板库';
  var desc = '「' + t.name + '」是一套' + t.cat + '风格的中文简历模板，共 ' + (t.pages || 1) + ' 页' + (t.photo ? '，带可替换证件照位' : '，不含照片位') + '。免注册，打开即可在纸面上直接修改，导出 A4 PDF。';
  document.getElementById('crumbName').textContent = t.name;
  var metaDesc = document.querySelector('meta[name=description]');
  if (metaDesc) metaDesc.setAttribute('content', desc);
  var related = LIST.filter(function(x){ return x.cat === t.cat && x.id !== t.id; }).slice(0,4);
  content.innerHTML =
    '<div class="layout">' +
      '<div>' +
        '<div class="preview-card">' +
          '<div class="preview-stage"><a href="assets/thumbs/' + esc(t.id) + '.webp" target="_blank" rel="noopener" title="打开原图"><img id="bigImg" src="assets/thumbs/' + esc(t.id) + '.webp" alt="' + esc(t.name) + ' 整页预览" width="794" height="1123"></a></div>' +
          '<div class="preview-tools"><span class="hint">整页预览 · 点击图片可看原图</span><span><a class="btn" href="assets/thumbs/' + esc(t.id) + '.webp" target="_blank" rel="noopener">看原图</a> <a class="btn" href="' + useUrl(t) + '">打开编辑器</a></span></div>' +
        '</div>' +
        '<div class="section"><h2>这套模板适合谁</h2><div class="desc">' + esc(desc) + '<div class="modules"><span>基本信息</span><span>教育背景</span><span>工作 / 实习</span><span>项目经历</span><span>技能特长</span><span>荣誉证书</span><span>自我评价</span></div></div></div>' +
      '</div>' +
      '<aside class="info">' +
        '<h1>' + esc(t.name) + '</h1>' +
        '<p class="sub">' + esc(t.cat) + '风格 · ' + (t.pages || 1) + ' 页 · ' + (t.photo ? '可换证件照' : '无照片位') + '</p>' +
        '<div class="meta-row"><span class="pill">' + esc(t.cat) + '</span><span class="pill">' + (t.pages || 1) + ' 页</span>' + (t.photo ? '<span class="pill warm">可换照片</span>' : '<span class="pill">无照片位</span>') + '<span class="pill">中文</span></div>' +
        (t.id === 't057' ? '<div class="warn">这套模板用整页背景图 + 绝对定位实现双栏，浏览器预览正常，但打印时左侧背景图可能溢出、正文分页错位。建议先「打印 / 导出PDF」预览确认，或换用同风格的其他双栏模板。</div>' : '') +
        '<div class="buy">' +
          '<h2>使用这套模板</h2><div class="price">免费 <small>· 无需注册</small></div>' +
          '<a class="cta" href="' + useUrl(t) + '">打开并开始编辑</a>' +
          '<p class="note">内容只保存在你的浏览器，不上传</p>' +
          '<ul><li>打开即改，自动保存</li><li>可替换证件照</li><li>工具条可换强调色 / 字体</li><li>打印或导出 A4 PDF</li><li>可下载 HTML / 备份 JSON</li></ul>' +
        '</div>' +
        '<div class="section"><h2>相关模板</h2><div class="related">' + related.map(function(x){
          return '<a class="rel-card" href="' + url(x) + '"><img src="assets/thumbs/' + esc(x.id) + '.webp" alt="' + esc(x.name) + '" loading="lazy"><b>' + esc(x.name) + '</b></a>';
        }).join('') + '</div></div>' +
      '</aside>' +
    '</div>' +
    '<div class="mobile-cta"><span class="price">免费</span><a class="cta" href="' + useUrl(t) + '">打开并编辑</a></div>';
}
</script>
